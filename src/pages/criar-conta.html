<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblio-Tech - Criar conta</title>
    <link rel="stylesheet" href="../style.css">
    <meta name="theme-color" content="#fdf7f0">
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%2032%2032'%3E%3Crect%20width%3D'32'%20height%3D'32'%20rx%3D'9'%20fill%3D'%23e7744c'%2F%3E%3Crect%20x%3D'9'%20y%3D'7'%20width%3D'4'%20height%3D'18'%20rx%3D'2'%20fill%3D'white'%2F%3E%3Crect%20x%3D'14.5'%20y%3D'7'%20width%3D'4'%20height%3D'18'%20rx%3D'2'%20fill%3D'white'%20opacity%3D'0.85'%2F%3E%3Crect%20x%3D'20'%20y%3D'7'%20width%3D'4'%20height%3D'18'%20rx%3D'2'%20fill%3D'white'%20opacity%3D'0.7'%2F%3E%3C%2Fsvg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap">
</head>
<body class="pagina-login">
    <main class="login-wrapper">
        <section class="login-card">
            <div class="login-marca">
                <span class="logo-icon"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H19a1 1 0 0 1 1 1v18a1 1 0 0 1-1 1H6.5a1 1 0 0 1 0-5H20" /></svg></span>
                <span class="logo-text">Biblio<strong>Tech</strong></span>
            </div>

            <h1>Criar sua conta</h1>
            <p class="login-subtitulo">
                Leva menos de um minuto e já dá para usar o catálogo e os empréstimos.
            </p>

            <form class="login-formulario" id="formulario-criar-conta">
                <div class="grupo-formulario">
                    <label class="label-formulario" for="conta-nome">Nome</label>
                    <input
                        type="text"
                        id="conta-nome"
                        class="input-formulario"
                        placeholder="Como você quer ser chamado"
                        autocomplete="name"
                        minlength="2"
                        required
                    >
                </div>

                <div class="grupo-formulario">
                    <label class="label-formulario" for="conta-email">E-mail</label>
                    <input
                        type="email"
                        id="conta-email"
                        class="input-formulario"
                        placeholder="seu@email.com"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="grupo-formulario">
                    <label class="label-formulario" for="conta-senha">Senha</label>
                    <input
                        type="password"
                        id="conta-senha"
                        class="input-formulario"
                        placeholder="Mínimo de 4 caracteres"
                        autocomplete="new-password"
                        minlength="4"
                        required
                    >
                </div>

                <button type="submit" class="btn-cadastrar-usuarios" id="btn-criar-conta">Criar conta</button>
            </form>

            <div id="mensagem-feedback" class="mensagem-feedback" style="display: none;"></div>

            <p class="login-aviso">
                Sua conta é criada como <strong>usuário comum</strong>: você consulta o acervo,
                empresta e devolve livros. Gerenciar livros e permissões fica com as contas dev.
            </p>

            <p class="login-rodape">
                Já tem conta?
                <a href="login.html">Entrar</a>
            </p>
        </section>
    </main>

    <script src="../cadastro.js"></script>
</body>
</html>
